# Drafts a GitHub release when a push to main changes addon.version in checkmate/checkmate.lua, or when it's run by
# hand. The draft holds the zip and that version's CHANGELOG.md section. Only people with write access to the repo
# see it until it's published.
name: Draft release

on:
  push:
    branches: [main]
    paths: [checkmate/checkmate.lua]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Check the version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() { sed -nE "s/^addon\.version *= *'([^']+)';.*/\1/p"; }
          version=$(read_version < checkmate/checkmate.lua)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A run by hand has no commit before it, and neither does the first push of main.
          if [ -n "$BEFORE" ] && git fetch --quiet --depth 1 origin "$BEFORE" 2>/dev/null; then
            if [ "$(git show "$BEFORE:checkmate/checkmate.lua" | read_version)" = "$version" ]; then
              echo "This push didn't change addon.version from $version."
              exit 0
            fi
          fi
          tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if printf '%s\n' "$tags" | grep -qx "v$version"; then
            echo "v$version already has a release."
            exit 0
          fi
          echo "draft=true" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        if: steps.version.outputs.draft == 'true'
        run: python tools/build_release.py --out "$RUNNER_TEMP"

      - name: Draft the release
        if: steps.version.outputs.draft == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The notes are the lines under "## <version>" in CHANGELOG.md, up to the next version.
          awk -v heading="## $VERSION" '{ sub(/\r$/, "") } $0 == heading { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
          gh release create "v$VERSION" "$RUNNER_TEMP/checkmate-$VERSION.zip" --draft --target "$GITHUB_SHA" \
            --title "checkmate $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
